[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrephish"
version = "1.1.0"
description = "Phishing Operator Framework -- campaigns, tracking, OPSEC"
authors = [{ name = "Inayat Hussain" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0", "beautifulsoup4>=4.12.0", "dnspython>=2.4.0"]

[project.scripts]
spectrephish = "main:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["main", "config"]
